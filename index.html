<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Share your deepest thoughts anonymously on the Confession Wall">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='80' text-anchor='middle' dominant-baseline='middle'>🎭</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23667eea' width='180' height='180' rx='40'/><text x='90' y='90' font-size='120' fill='white' text-anchor='middle' dominant-baseline='middle'>🎭</text></svg>">
    <title>Confession Wall</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.5s ease-in;
        }

        header h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .form-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            animation: slideUp 0.5s ease-in;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            max-width: 200px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .confessions-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            animation: fadeIn 0.5s ease-in;
        }

        .confession-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            animation: scaleIn 0.3s ease-in;
        }

        .confession-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            background-size: 200% 100%;
            animation: gradientShift 3s infinite;
        }

        .confession-text {
            color: #333;
            line-height: 1.6;
            margin-bottom: 15px;
            word-wrap: break-word;
            font-size: 0.95em;
        }

        .confession-author {
            color: #999;
            font-size: 0.85em;
            margin-bottom: 12px;
            font-style: italic;
        }

        .confession-actions {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
        }

        .btn-like {
            background: #fff3cd;
            color: #856404;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-like:hover {
            background: #ffeaa7;
            transform: scale(1.05);
        }

        .btn-like.liked {
            background: #ff6b6b;
            color: white;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: white;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            animation: slideDown 0.3s ease-in;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            animation: slideDown 0.3s ease-in;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2em;
            }

            .confessions-container {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-submit {
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎭 CONFESSION WALL 🎭</h1>
            <p>Share your deepest thoughts anonymously</p>
        
        </header>

        <div class="form-container">
            <div id="successMessage" class="success-message">✓ Confession posted successfully!</div>
            <div id="errorMessage" class="error-message">✗ Something went wrong. Please try again.</div>
            
            <form id="confessionForm">
                <div class="form-group">
                    <label for="author">Your Name (optional):</label>
                    <input type="text" id="author" placeholder="Anonymous" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="confession">Your Confession:</label>
                    <textarea id="confession" placeholder="Tell me your confession..." required></textarea>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn-submit">Submit Confession</button>
                </div>
            </form>
        </div>

        <div id="confessionsContainer" class="confessions-container">
            <div class="loading">Loading confessions...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        // Load confessions when page loads
        document.addEventListener('DOMContentLoaded', loadConfessions);

        // Handle form submission
        document.getElementById('confessionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const author = document.getElementById('author').value.trim() || 'Anonymous';
            const confession = document.getElementById('confession').value.trim();
            
            if (!confession) {
                showError('Please write a confession!');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/confessions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ author, text: confession })
                });

                if (response.ok) {
                    document.getElementById('confession').value = '';
                    document.getElementById('author').value = '';
                    showSuccess('Confession posted!');
                    setTimeout(loadConfessions, 500);
                } else {
                    showError('Failed to post confession');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Network error. Make sure the server is running!');
            }
        });

        async function loadConfessions() {
            try {
                const response = await fetch(`${API_URL}/confessions`);
                const confessions = await response.json();
                displayConfessions(confessions);
            } catch (error) {
                console.error('Error loading confessions:', error);
                document.getElementById('confessionsContainer').innerHTML = 
                    '<div class="empty-message">Unable to connect to server. Make sure it\'s running on http://localhost:3000</div>';
            }
        }

        function displayConfessions(confessions) {
            const container = document.getElementById('confessionsContainer');
            
            if (confessions.length === 0) {
                container.innerHTML = '<div class="empty-message">No confessions yet. Be the first to share!</div>';
                return;
            }

            container.innerHTML = confessions.map(confession => `
                <div class="confession-card" data-id="${confession.id}">
                    <div class="confession-text">"${confession.text}"</div>
                    <div class="confession-author">- ${confession.author}</div>
                    <div class="confession-actions">
                        <button class="btn-like ${confession.liked ? 'liked' : ''}" data-id="${confession.id}">
                            ❤️ Likes ${confession.likes}
                        </button>
                        <button class="btn-delete" data-id="${confession.id}">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');

            // Add event listeners to like buttons
            document.querySelectorAll('.btn-like').forEach(btn => {
                btn.addEventListener('click', () => likeConfession(btn.dataset.id));
            });

            // Add event listeners to delete buttons
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => deleteConfession(btn.dataset.id));
            });
        }

        async function likeConfession(id) {
            try {
                const response = await fetch(`${API_URL}/confessions/${id}/like`, {
                    method: 'POST'
                });

                if (response.ok) {
                    loadConfessions();
                }
            } catch (error) {
                console.error('Error liking confession:', error);
            }
        }

        async function deleteConfession(id) {
            if (!confirm('Are you sure you want to delete this confession?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/confessions/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadConfessions();
                    showSuccess('Confession deleted!');
                } else {
                    showError('Failed to delete confession');
                }
            } catch (error) {
                console.error('Error deleting confession:', error);
                showError('Error deleting confession');
            }
        }

        function showSuccess(message) {
            const msgEl = document.getElementById('successMessage');
            msgEl.textContent = '✓ ' + message;
            msgEl.style.display = 'block';
            setTimeout(() => {
                msgEl.style.display = 'none';
            }, 3000);
        }

        function showError(message) {
            const msgEl = document.getElementById('errorMessage');
            msgEl.textContent = '✗ ' + message;
            msgEl.style.display = 'block';
            setTimeout(() => {
                msgEl.style.display = 'none';
            }, 3000);
        }

        // Register Service Worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('✓ Service Worker registered successfully');
                    })
                    .catch(error => {
                        console.log('✗ Service Worker registration failed:', error);
                    });
            });
        }
    </script>

</body>
